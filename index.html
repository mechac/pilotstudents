<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Элиас: аэропорт и самолёт</title>
<style>
:root{--bg:#eaf3ff;--ink:#0b2545;--muted:#4a6285;--sign:#1b5fd1;--signink:#ffffff;--panel:#ffffff;--line:#c3d6f2;--ok:#1f7a3d;--no:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1b33;--ink:#eaf3ff;--muted:#9db4d6;--panel:#12294a;--line:#25406b;--sign:#2c6fdc;--ok:#5ad083;--no:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1b33;--ink:#eaf3ff;--muted:#9db4d6;--panel:#12294a;--line:#25406b;--sign:#2c6fdc;--ok:#5ad083;--no:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Arial,"Segoe UI",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:480px;min-height:100vh;padding:16px;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:8px 0 0;font-weight:800;letter-spacing:-.01em}
p{margin:0;line-height:1.45;color:var(--muted)}
.hide{display:none!important}
.bar{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-variant-numeric:tabular-nums}
.bar span{font-size:1.1rem}
.who{text-align:center;font-weight:800;font-size:1.15rem}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--sign);transition:width .25s linear}
.fill.low{background:var(--no)}
.sign{background:var(--sign);color:var(--signink);border:6px solid var(--signink);outline:3px solid var(--sign);border-radius:12px;padding:40px 14px;text-align:center;font-weight:800;font-size:clamp(2rem,10vw,3rem);line-height:1.05;min-height:190px;display:flex;align-items:center;justify-content:center;margin:6px 3px;overflow-wrap:anywhere}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:800;font-size:1.1rem;padding:18px 10px;border-radius:12px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
button:active{transform:scale(.98)}
.go{background:var(--sign);color:var(--signink);border-color:var(--sign)}
.yes{border-color:var(--ok);color:var(--ok)}
.no{border-color:var(--no);color:var(--no)}
.big{font-size:4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.lbl{color:var(--ink);font-weight:700;margin-bottom:8px}
.opts{display:flex;gap:8px}
.opts button{flex:1;padding:12px 4px;font-size:1rem;border-width:1px}
.opts button[aria-pressed="true"]{background:var(--sign);color:var(--signink);border-color:var(--sign)}
.trow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;border:2px solid transparent;margin-top:6px}
.trow.turn{border-color:var(--sign)}
.trow input{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px}
.trow .nm{flex:1;font-weight:700}
.trow .pts{font-weight:800;font-size:1.3rem;min-width:2.5ch;text-align:right;font-variant-numeric:tabular-nums}
ul{margin:8px 0 0;padding-left:20px;color:var(--muted);line-height:1.5}
.cat{text-align:center;font-weight:700;color:var(--muted);min-height:1.2em}
.credit{margin-top:auto;padding:14px 0 6px;text-align:center;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;line-height:1.5}
.credit b{color:var(--ink)}
.banner{display:block;width:100%;height:auto;border-radius:14px}
.ico{width:22px;height:22px;vertical-align:-4px;color:var(--sign);fill:currentColor}
.fly{display:flex;justify-content:center;gap:18px;margin-bottom:8px}
.fly .ico{width:20px;height:20px;opacity:.75}
.fly .ico:nth-child(1){transform:rotate(-35deg)}
.fly .ico:nth-child(2){transform:rotate(20deg)}
.fly .ico:nth-child(3){transform:rotate(55deg)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="plane" viewBox="0 0 64 64"><path d="M32 2C35 2 36 8 36 14L36 50L32 62L28 50L28 14C28 8 29 2 32 2Z"/><path d="M28 24L4 40L4 45L28 38ZM36 24L60 40L60 45L36 38Z"/><path d="M28 50L16 58L16 61L28 57ZM36 50L48 58L48 61L36 57Z"/></symbol></svg>
<main>
<section id="start">
<svg class="banner" viewBox="0 0 480 140" role="img" aria-label="Самолёт в небе"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b5fd1"/><stop offset="1" stop-color="#8bbcff"/></linearGradient></defs><rect width="480" height="140" rx="14" fill="url(#sky)"/><g fill="#fff" opacity=".9"><ellipse cx="70" cy="114" rx="50" ry="14"/><ellipse cx="108" cy="104" rx="32" ry="14"/><ellipse cx="390" cy="124" rx="62" ry="14"/><ellipse cx="350" cy="113" rx="30" ry="12"/></g><path d="M20 118C140 112 230 92 330 54" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><g fill="#fff"><g transform="translate(335 50) rotate(52) scale(1.3) translate(-32 -32)"><use href="#plane" width="64" height="64"/></g><g opacity=".7" transform="translate(110 34) rotate(38) scale(.55) translate(-32 -32)"><use href="#plane" width="64" height="64"/></g><g opacity=".5" transform="translate(215 22) rotate(48) scale(.4) translate(-32 -32)"><use href="#plane" width="64" height="64"/></g></g></svg>
<h1>Элиас: аэропорт и самолёт</h1>
<p>Один из команды объясняет слово другими словами, свои угадывают. Без однокоренных слов и без перевода. Команды ходят по очереди.</p>
<div class="panel" style="margin-top:14px">
<div class="lbl">Сколько команд</div>
<div class="opts" id="tcount">
<button data-n="2" aria-pressed="true">2</button>
<button data-n="3" aria-pressed="false">3</button>
<button data-n="4" aria-pressed="false">4</button>
</div>
<div id="teams" style="margin-top:6px"></div>
</div>
<div class="panel">
<div class="lbl">Длина раунда</div>
<div class="opts" id="lens">
<button data-s="30" aria-pressed="false">30 с</button>
<button data-s="60" aria-pressed="true">60 с</button>
<button data-s="90" aria-pressed="false">90 с</button>
</div>
</div>
<button class="go" id="startBtn" style="width:100%"></button>
<button id="resetStart" style="width:100%;font-size:1rem;padding:12px">Обнулить счёт</button>
</section>

<section id="play" class="hide">
<div class="who"><svg class="ico" viewBox="0 0 64 64" aria-hidden="true"><use href="#plane" width="64" height="64"/></svg> <span id="who"></span></div>
<div class="bar"><span id="time">60</span><span id="score">Очки: 0</span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="sign" id="word"></div>
<div class="cat" id="cat"></div>
<div class="row">
<button class="no" id="skip">Пропуск −1</button>
<button class="yes" id="ok">Угадали +1</button>
</div>
</section>

<section id="end" class="hide">
<h1 id="endTitle">Раунд окончен</h1>
<div class="big" id="final">0</div>
<p style="text-align:center" id="stats"></p>
<div class="panel"><div class="lbl">Общий счёт</div><div id="board"></div></div>
<div class="panel" id="missed"></div>
<button class="go" id="again" style="width:100%"></button>
<button id="toStart" style="width:100%;font-size:1rem;padding:12px">Настройки и имена команд</button>
</section>

<footer class="credit"><div class="fly" aria-hidden="true"><svg class="ico" viewBox="0 0 64 64"><use href="#plane" width="64" height="64"/></svg><svg class="ico" viewBox="0 0 64 64"><use href="#plane" width="64" height="64"/></svg><svg class="ico" viewBox="0 0 64 64"><use href="#plane" width="64" height="64"/></svg></div><b>КАИ</b><br>Сделал Ажиматов Б.С.</footer>
</main>

<script>
(function(){
var A="Аэропорт",P="Самолёт";
var W=[["Runway",A],["Taxiway",A],["Apron",A],["Terminal",A],["Check-in desk",A],["Boarding pass",A],["Security checkpoint",A],["Passport control",A],["Baggage claim",A],["Customs",A],["Departure gate",A],["Jet bridge",A],["Control tower",A],["Hangar",A],["Duty free",A],["Luggage cart",A],["Arrival hall",A],["Fuel truck",A],["Windsock",A],["Runway lights",A],["Gate agent",A],["Transit",A],["Boarding",A],["Delay",A],
["Fuselage",P],["Wing",P],["Aileron",P],["Flap",P],["Slat",P],["Spoiler",P],["Rudder",P],["Elevator",P],["Tail",P],["Vertical stabilizer",P],["Horizontal stabilizer",P],["Engine",P],["Nacelle",P],["Turbine",P],["Propeller",P],["Landing gear",P],["Cockpit",P],["Flight deck",P],["Cabin",P],["Cargo hold",P],["Pitot tube",P],["Winglet",P],["Black box",P],["Emergency exit",P],["Life vest",P],["Oxygen mask",P],["Seat belt",P],["Altimeter",P],["Autopilot",P],["Turbulence",P]];
var $=function(i){return document.getElementById(i)};
var len=60,deck=[],cur=null,score=0,end=0,timer=null,got=[],skipped=[];
var n=2,names=["Команда 1","Команда 2","Команда 3","Команда 4"],totals=[0,0,0,0],turn=0;
function nm(i){return (names[i]||"").trim()||("Команда "+(i+1))}
function show(id){["start","play","end"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function next(){if(!deck.length)deck=shuffle(W.slice());cur=deck.pop();$("word").textContent=cur[0];$("cat").textContent=cur[1]}
function buzz(){try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}}
function setScore(){$("score").textContent="Очки: "+score}
function btnText(){var t="Ходит: "+nm(turn);$("startBtn").textContent="Начать раунд. "+t;$("again").textContent="Следующий раунд. "+t}
function buildTeams(){
var box=$("teams");box.innerHTML="";
for(var i=0;i<n;i++){(function(i){
var r=document.createElement("div");r.className="trow"+(i===turn?" turn":"");
var inp=document.createElement("input");inp.value=names[i];inp.maxLength=20;inp.setAttribute("aria-label","Название команды "+(i+1));
inp.addEventListener("input",function(){names[i]=inp.value;btnText()});
var pts=document.createElement("span");pts.className="pts";pts.textContent=totals[i];
r.appendChild(inp);r.appendChild(pts);box.appendChild(r)})(i)}
btnText()}
function buildBoard(){
var box=$("board");box.innerHTML="";
var idx=[];for(var i=0;i<n;i++)idx.push(i);
idx.sort(function(a,b){return totals[b]-totals[a]});
idx.forEach(function(i){
var r=document.createElement("div");r.className="trow"+(i===turn?" turn":"");
var s=document.createElement("span");s.className="nm";s.textContent=nm(i);
var p=document.createElement("span");p.className="pts";p.textContent=totals[i];
r.appendChild(s);r.appendChild(p);box.appendChild(r)})}
function startRound(){score=0;got=[];skipped=[];setScore();$("who").textContent="Объясняет: "+nm(turn);show("play");next();end=Date.now()+len*1000;clearInterval(timer);timer=setInterval(tick,250);tick()}
function tick(){var left=Math.max(0,(end-Date.now())/1000);$("time").textContent=Math.ceil(left);var f=$("fill");f.style.width=(left/len*100)+"%";f.classList.toggle("low",left<=10);if(left<=0)finish()}
function finish(){
clearInterval(timer);
totals[turn]+=score;
$("endTitle").textContent="Раунд окончен: "+nm(turn);
$("final").textContent=(score>0?"+":"")+score;
$("stats").textContent="Угадано: "+got.length+", пропущено: "+skipped.length;
turn=(turn+1)%n;
buildBoard();btnText();
var m=$("missed");m.classList.toggle("hide",!skipped.length);m.innerHTML="";
if(skipped.length){var p=document.createElement("div");p.className="lbl";p.textContent="Пропущенные слова";m.appendChild(p);var u=document.createElement("ul");skipped.forEach(function(w){var l=document.createElement("li");l.textContent=w;u.appendChild(l)});m.appendChild(u)}
show("end")}
function resetAll(){totals=[0,0,0,0];turn=0;deck=[];buildTeams()}
$("ok").onclick=function(){if(!cur)return;score++;got.push(cur[0]);setScore();buzz();next()};
$("skip").onclick=function(){if(!cur)return;score--;skipped.push(cur[0]);setScore();buzz();next()};
$("startBtn").onclick=startRound;
$("again").onclick=startRound;
$("toStart").onclick=function(){buildTeams();show("start")};
$("resetStart").onclick=resetAll;
$("tcount").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var k=+b.dataset.n;if(k!==n){n=k;totals=[0,0,0,0];turn=0}
[].forEach.call($("tcount").children,function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});buildTeams()});
$("lens").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;len=+b.dataset.s;[].forEach.call($("lens").children,function(x){x.setAttribute("aria-pressed",x===b?"true":"false")})});
buildTeams();
})();
</script>
</body>
</html>
